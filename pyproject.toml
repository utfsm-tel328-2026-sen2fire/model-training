[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-training"
version = "0.1.0"
description = "Sen2Fire fire-segmentation training pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cuda = ["torch", "torchvision"]
rocm = [
    "torch ; sys_platform == 'linux'",
    "torchvision ; sys_platform == 'linux'",
    "triton-rocm ; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
  [{ extra = "cuda" }, { extra = "rocm" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "cuda" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", extra = "cuda" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true
